version: 2
updates:
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: daily
    time: "09:25"
  open-pull-requests-limit: 10 
  groups:
    github-actions:
      patterns:
      - "*"
- package-ecosystem: maven
  directory: "/"
  schedule:
    interval: daily
    time: "12:25"
  open-pull-requests-limit: 10
  groups:
    maven:
      patterns:
      - "*"
