name: Lag release

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      ref:
        required: true
        type: string
  release:
    types: [published]

jobs:
  publish-release:
    permissions:
      packages: write
      contents: read
    runs-on: ubuntu-latest
    steps:
            
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.event.release.tag_name }}

      - name: Set up JDK 27
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: 'temurin'
          java-version: '27'

      - name: Setup build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
            
      - name: Publish artifact
        env:
          NEW_VERSION: ${{ inputs.version || github.event.release.tag_name }}
          GITHUB_USERNAME: x-access-token
          GITHUB_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN:  ${{ secrets.GITHUB_TOKEN }}
        run: |
          mvn --settings .m2/settings.xml --batch-mode versions:set -DnewVersion="$NEW_VERSION" -DgenerateBackupPoms=false
          mvn --settings .m2/settings.xml --batch-mode deploy -Dmaven.wagon.http.pool=false
